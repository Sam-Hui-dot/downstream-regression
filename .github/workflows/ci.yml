name: Downstream regression checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  historical-comparison:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      MOON_WORK: 'off'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install the historical MoonBit toolchain and core
        run: |
          $toolchain = Join-Path $env:RUNNER_TEMP 'moonbit-0.10.20'
          $sdk = Join-Path $env:RUNNER_TEMP 'moonbit-0.10.20.zip'
          $core = Join-Path $env:RUNNER_TEMP 'core-0.10.20.tar.gz'
          function Get-VerifiedArchive($Url, $Destination, $Sha256) {
            curl.exe --fail --location --retry 3 --max-time 120 --output $Destination $Url
            if ($LASTEXITCODE) { throw "Download failed: $Url" }
            if ((Get-FileHash -LiteralPath $Destination -Algorithm SHA256).Hash -ne $Sha256) {
              throw "Unexpected archive checksum: $Destination"
            }
          }
          Get-VerifiedArchive 'https://cli.moonbitlang.com/binaries/0.10.20%2B65efd5b93/moonbit-windows-x86_64.zip' $sdk 'bdff9a3b2d7c61a3adae2fe09221d3de63effc6cab28bfa0cbeb94fb0d529d79'
          Get-VerifiedArchive 'https://cli.moonbitlang.com/cores/core-0.10.20%2B65efd5b93.tar.gz' $core '8ec2a2c01335501d703867bb4eef5f92d3cd7e1ae1ee5f7f14d54d16d2c7c2b5'
          Expand-Archive -LiteralPath $sdk -DestinationPath $toolchain
          $library = Join-Path $toolchain 'lib'
          New-Item -ItemType Directory -Force -Path $library | Out-Null
          tar.exe -xzf $core -C $library
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:MOON_HOME = $toolchain
          $bin = Join-Path $toolchain 'bin'
          $moon = Join-Path $bin 'moon.exe'
          # The official installer creates this launcher. The archive only contains moon.exe.
          New-Item -ItemType HardLink -Path (Join-Path $bin 'moonx.exe') -Target $moon | Out-Null
          & $moon -C (Join-Path $library 'core') bundle --warn-list -a --all
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "MOON_HOME=$toolchain" >> $env:GITHUB_ENV
          $bin >> $env:GITHUB_PATH
      - name: Verify formatting, multi-target checks, unit tests, and build
        run: |
          moon version --all
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          moon update
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          moon fmt --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($target in 'wasm', 'wasm-gc', 'js', 'native') {
            Write-Output "Checking and testing target: $target"
            moon check --target $target --deny-warn
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            moon test --target $target --deny-warn
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          moon build --target wasm
          exit $LASTEXITCODE
      - name: Verify root library from an independent consumer module
        run: |
          $ws = Join-Path $env:RUNNER_TEMP 'independent-consumer-ws'
          $lib = Join-Path $ws 'library'
          $consumer = Join-Path $ws 'consumer'
          New-Item -ItemType Directory -Force -Path $lib, $consumer | Out-Null
          foreach ($f in 'moon.mod', 'moon.pkg', 'types.mbt', 'parser.mbt', 'manifest.mbt', 'compare.mbt', 'report.mbt', 'mbti.mbt', 'html_report.mbt') {
            Copy-Item -LiteralPath $f -Destination (Join-Path $lib $f)
          }
          Set-Content -LiteralPath (Join-Path $ws 'moon.work') -Value 'members = ["library", "consumer"]'
          Set-Content -LiteralPath (Join-Path $consumer 'moon.mod') -Value @"
          name = "consumer/check"
          version = "0.1.0"

          import {
            "Sam-Hui-dot/downstream-regression@0.3.0",
          }
          "@
          Set-Content -LiteralPath (Join-Path $consumer 'moon.pkg') -Value @"
          import {
            "Sam-Hui-dot/downstream-regression" @dr,
          }
          pkgtype(kind: "executable")
          "@
          Set-Content -LiteralPath (Join-Path $consumer 'main.mbt') -Value @'
          fn main raise {
            let counts = @dr.parse_test_counts("Total tests: 4, passed: 4, failed: 0.")
            guard counts == Some({ total: 4, passed: 4, failed: 0, skipped: 0 }) else {
              abort("unexpected counts")
            }
            let rewritten = @dr.rewrite_manifest_dependency(
              MoonModJson,
              "{\"name\":\"app\",\"deps\":{\"a/b\":\"0.1.0\"}}",
              "a/b",
              "0.1.0",
              "0.2.0",
            )
            guard rewritten.contains("\"a/b\":\"0.2.0\"") else {
              abort("unexpected rewrite")
            }
            let mbti = @dr.diff_mbti(
              "package \"a/b\"\npub fn f(Int) -> Int\n",
              "package \"a/b\"\npub fn f(Int) -> String\n",
            )
            guard mbti.breaking_count == 1 else {
              abort("unexpected mbti diff")
            }
            println("consumer: ok")
          }
          '@
          $env:MOON_WORK = ''
          moon -C $consumer run --target js --deny-warn .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          moon -C $consumer run --target wasm --deny-warn .
          exit $LASTEXITCODE
      - name: Fetch historical downstreams outside the project
        run: |
          git clone https://github.com/moonbitlang/moonback.git ../downstream-upgrade-study/moonback
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git clone https://github.com/moonbitlang/moonyacc.git ../downstream-upgrade-study/moonyacc
          exit $LASTEXITCODE
      - name: Check regression and passing control
        run: |
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          $batchOut = Join-Path $env:RUNNER_TEMP 'historical-batch-evidence'
          ./examples/verify-historical.ps1 -OutDir $batchOut
          $summaryMd = Join-Path $batchOut 'batch.md'
          if (Test-Path -LiteralPath $summaryMd -PathType Leaf) {
            Get-Content -Raw -LiteralPath $summaryMd >> $env:GITHUB_STEP_SUMMARY
          }
          exit 0
      - name: Detect a candidate-only compiler failure
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          $moon = (Get-Command moon -CommandType Application | Select-Object -First 1).Source
          $git = (Get-Command git -CommandType Application | Select-Object -First 1).Source
          $compileOut = Join-Path $env:RUNNER_TEMP 'compile-regression-evidence'
          $output = & $moon run --target wasm cmd/main -- --out $compileOut snapshot $moon $git $PWD.Path HEAD examples/compile-regression moonbitlang/async 0.22.0 0.21.0 wasm
          $code = $LASTEXITCODE
          $report = $output | Select-Object -Last 1 | ConvertFrom-Json
          if ($code -ne 1 -or $report.status -ne 'candidate_compile_failure' -or
              $report.baseline.counts.passed -ne 1 -or $report.candidate.compiler_errors -notcontains 'Error: [4021]') {
            throw "Expected an undefined API diagnostic on the candidate only. Exit code $code. Output: $output"
          }
          $reportMd = Join-Path $compileOut 'report.md'
          if (-not (Test-Path -LiteralPath $reportMd -PathType Leaf)) {
            throw "Expected Markdown report was not written: $reportMd"
          }
          $reportHtml = Join-Path $compileOut 'report.html'
          if (-not (Test-Path -LiteralPath $reportHtml -PathType Leaf)) {
            throw "Expected HTML report was not written: $reportHtml"
          }
          & $moon run --target wasm cmd/main -- mbti-diff pkg.generated.mbti pkg.generated.mbti --fail-on-breaking
          if ($LASTEXITCODE) { throw "mbti-diff self-comparison failed with exit $LASTEXITCODE" }
          "`n---`n" >> $env:GITHUB_STEP_SUMMARY
          Get-Content -Raw -LiteralPath $reportMd >> $env:GITHUB_STEP_SUMMARY
          Write-Output 'Compiler regression detected: handle_cancellation is missing in async 0.21.0.'
          exit 0
